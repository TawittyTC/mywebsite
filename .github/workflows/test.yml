name: Site tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      # The browser download occasionally hangs at the CDN; bound each
      # attempt and retry instead of letting it eat the whole job timeout.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install chromium && exit 0
            echo "Chromium download attempt $i timed out, retrying..."
          done
          exit 1

      - name: Run site tests
        run: npm test
